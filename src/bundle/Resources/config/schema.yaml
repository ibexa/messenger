tables:
    ibexa_messenger_messages:
        indexes:
            ibexa_messenger_messages_queue_available_delivered_idx: { fields: [ queue_name, available_at, delivered_at, id ] }
        id:
            id:
                type: bigint
                nullable: false
                options:
                    autoincrement: true
        fields:
            body:
                type: text
                nullable: false
            headers:
                type: text
                nullable: false
            queue_name:
                type: string
                length: 190
                nullable: false
            created_at:
                type: datetime_immutable
                nullable: false
            available_at:
                type: datetime_immutable
                nullable: false
            delivered_at:
                type: datetime_immutable
                nullable: true

    ibexa_messenger_lock_keys:
        id:
            key_id:
                type: string
                length: 64
                nullable: false
        fields:
            key_token:
                type: string
                length: 44
                nullable: false
            key_expiration:
                type: integer
                nullable: false
                options:
                    unsigned: true
